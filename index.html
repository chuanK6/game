<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Redirect before the app loads, including pages served from a browser cache.
      if (location.protocol === 'http:' && location.hostname === 'youlang.cc.cd') {
        const secureUrl = new URL(location.href)
        secureUrl.protocol = 'https:'
        location.replace(secureUrl.href)
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0788c7" />
    <script>
      // Apply before the first paint; keep the storage key in sync with stores/theme.ts.
      (() => {
        let preference = null
        try { preference = localStorage.getItem('youlun-theme') } catch {}
        const dark = preference === 'dark' || (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').content = dark ? '#0d1520' : '#0788c7'
      })()
    </script>
    <!--seo:start-->
    <title>游浪 - PC 游戏资源库</title>
    <meta name="description" content="游浪 PC 游戏资源库，发现、筛选和获取优质游戏资源。" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://youlang.cc.cd/" />
    <!--seo:end-->
    <meta name="msvalidate.01" content="D7B773EF012EE6DEFDAAF4518C4B3902" />
    <link rel="icon" type="image/png" href="/assets/brand/site-mark.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
