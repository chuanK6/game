name = "game-web64639712467"
main = "worker/src/index.ts"
compatibility_date = "2026-08-31"

[vars]
APP_ENV = "production"
ALLOWED_ORIGIN = "https://game-web64639712467.t0l0qbxa.workers.dev"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "youlun-db"
database_id = "aeef8550-5864-46d1-9e07-e10ec3b3f646"
migrations_dir = "worker/migrations"
